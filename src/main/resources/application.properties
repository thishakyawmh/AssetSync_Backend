spring.application.name=AssetSync

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/AssetSync_db?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Keep schema updates configurable until a versioned migration tool is introduced.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8085}
