spring.application.name=AssetSync

spring.datasource.url=jdbc:mysql://localhost:3306/AssetSync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate auto-creates tables (Perfect for rapid prototyping)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8085